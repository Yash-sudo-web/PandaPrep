name: Build and deploy Node.js app to Azure Web App - PandaPrep

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install dependencies, including Puppeteer
        run: |
          cd backend
          rm -rf node_modules package-lock.json  # Clean previous installs
          npm cache clean --force
          npm install
          npm install puppeteer --save  # Ensure Puppeteer is installed

      - name: Build the app
        run: |
          cd backend
          npm run build --if-present

      - name: Zip artifact for deployment
        run: |
          cd backend
          zip -r ../release.zip ./*

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: |
          unzip release.zip

      - name: Ensure Puppeteer is Installed
        run: npm install puppeteer --save

      - name: Install Browsers for Puppeteer
        run: npx puppeteer browsers install

      - name: List files to verify content
        run: ls -la

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'PandaPrep'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_92FA37EFBD2445E18D59F329D6603E9E }}
