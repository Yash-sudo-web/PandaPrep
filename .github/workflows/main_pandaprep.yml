name: Build and deploy Node.js app to Azure Web App - PandaPrep

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'  

      - name: Install dependencies and build
        run: |
          cd backend
          npm install
          npm run build --if-present

      - name: Zip artifact for deployment
        run: |
          cd backend
          npm install --production  # Ensure dependencies are included
          zip -r ../release.zip ./*
          
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: extracted-artifact  # Extract into a known directory

      - name: Unzip artifact for deployment
        run: | 
          cd extracted-artifact
          unzip release.zip -d extracted

      - name: Install Chrome for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Set Puppeteer to Use System Chrome
        run: echo "PUPPETEER_EXECUTABLE_PATH=$(which google-chrome)" >> $GITHUB_ENV

      - name: Install Puppeteer Dependencies
        run: npm install puppeteer

      - name: List files to verify content
        run: ls -la extracted-artifact/extracted

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'PandaPrep'
          slot-name: 'Production'
          package: extracted-artifact/extracted
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_92FA37EFBD2445E18D59F329D6603E9E }}
